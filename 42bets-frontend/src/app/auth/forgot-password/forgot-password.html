<div class="forgot-password-container">
  <div class="forgot-password-card card-surface">
    <div class="forgot-password-logo-wrap">
      <img src="/42bet-cropped.png" alt="42Bets" class="forgot-password-logo" />
    </div>

    <h1 class="forgot-password-title">{{ 'FORGOT_PASSWORD.TITLE' | translate }}</h1>

    <div *ngIf="showSuccess" class="success-message">
      <p>{{ successMessage }}</p>
      <p>{{ 'FORGOT_PASSWORD.SUCCESS_REDIRECT' | translate }}</p>
    </div>

    <form *ngIf="!showSuccess" (ngSubmit)="onForgotPassword()">
      <p class="help-text">{{ 'FORGOT_PASSWORD.HELP_TEXT' | translate }}</p>

      <div class="form-group">
        <input
          class="form-input-dark form-input-slate"
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          [placeholder]="'FORGOT_PASSWORD.EMAIL_PLACEHOLDER' | translate"
          required
        />
      </div>

      <button type="submit" class="btn-primary forgot-password-submit" [disabled]="loading">
        {{ loading ? ('FORGOT_PASSWORD.BTN_SUBMITTING' | translate) : ('FORGOT_PASSWORD.BTN_SUBMIT' | translate) }}
      </button>
    </form>

    <p class="back-link">
      <a (click)="navigateToLogin()" style="cursor: pointer">{{ 'FORGOT_PASSWORD.BACK_LINK' | translate }}</a>
    </p>
  </div>
</div>

<app-error-model [isOpen]="errorModalOpen" [message]="errorMessage" (closed)="closeErrorModal()">
</app-error-model>
