<div class="reset-password-container">
  <div class="reset-password-card">
    <h1>{{ 'RESET_PASSWORD.TITLE' | translate }}</h1>

    <div *ngIf="showSuccess" class="success-message">
      <p>{{ successMessage }}</p>
    </div>

    <form *ngIf="!showSuccess" (ngSubmit)="onResetPassword()">
      <p class="help-text">{{ 'RESET_PASSWORD.HELP_TEXT' | translate }}</p>

      <div class="form-group">
        <label for="newPassword">{{ 'RESET_PASSWORD.LABEL_NEW_PASSWORD' | translate }}</label>
        <input
          id="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          (input)="onPasswordChange()"
          name="newPassword"
          [placeholder]="'RESET_PASSWORD.PLACEHOLDER_NEW_PASSWORD' | translate"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">{{ 'RESET_PASSWORD.LABEL_CONFIRM_PASSWORD' | translate }}</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          (input)="onPasswordChange()"
          name="confirmPassword"
          [placeholder]="'RESET_PASSWORD.PLACEHOLDER_CONFIRM_PASSWORD' | translate"
          required
          [class.error]="!passwordsMatch && newPassword && confirmPassword"
        />
        <span *ngIf="!passwordsMatch && newPassword && confirmPassword" class="error-text">
          {{ 'RESET_PASSWORD.ERROR_PASSWORDS_MISMATCH' | translate }}
        </span>
      </div>

      <button
        type="submit"
        [disabled]="loading || !passwordsMatch || !newPassword || !confirmPassword"
      >
        {{ loading ? ('RESET_PASSWORD.BTN_SUBMITTING' | translate) : ('RESET_PASSWORD.BTN_SUBMIT' | translate) }}
      </button>
    </form>

    <p class="back-link">
      <a (click)="navigateToLogin()" style="cursor: pointer">{{ 'RESET_PASSWORD.BACK_LINK' | translate }}</a>
    </p>
  </div>
</div>

<app-error-model [isOpen]="errorModalOpen" [message]="errorMessage" (closed)="closeErrorModal()">
</app-error-model>
