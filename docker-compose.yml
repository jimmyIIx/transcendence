services:
  # Nginx reverse proxy (SSL termination)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence-nginx
    ports:
      - "${NGINX_HTTPS_PORT:-8443}:443"
      - "${NGINX_HTTP_PORT:-8081}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - transcendence-network
    restart: unless-stopped

  # Frontend Angular SSR
  frontend:
    build:
      context: ./42bets-frontend
      dockerfile: Dockerfile
    container_name: transcendence-frontend
    expose:
      - "4200"
    environment:
      API_URL: http://backend:8080
      NODE_ENV: development
      PORT: 4200
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - transcendence-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend Spring Boot
  backend:
    build:
      context: ./transcendence
      dockerfile: Dockerfile
    container_name: transcendence-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/transcendence
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      TZ: ${TZ:-Europe/Paris}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      OAUTH2_42_CLIENT_ID: ${OAUTH2_42_CLIENT_ID}
      OAUTH2_42_CLIENT_SECRET: ${OAUTH2_42_CLIENT_SECRET}
      OAUTH2_GITHUB_CLIENT_ID: ${OAUTH2_GITHUB_CLIENT_ID}
      OAUTH2_GITHUB_CLIENT_SECRET: ${OAUTH2_GITHUB_CLIENT_SECRET}
      SERVER_SERVLET_CONTEXT_PATH: /
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://localhost:8443}
      BLOCKCHAIN_ENABLED: ${BLOCKCHAIN_ENABLED:-false}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-https://data-seed-prebsc-1-s1.binance.org:8545}
      BLOCKCHAIN_CHAIN_ID: ${BLOCKCHAIN_CHAIN_ID:-97}
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-0x3aBfE55f0D8468edC60f363aECE6Ae136ADB99Dd}
      BLOCKCHAIN_TOKEN_DECIMALS: ${BLOCKCHAIN_TOKEN_DECIMALS:-18}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: transcendence-db
    environment:
      POSTGRES_DB: transcendence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - transcendence-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transcendence"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP server for development and containerized testing
  # Removed - using Gmail SMTP instead

networks:
  transcendence-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
