spring.application.name=transcendence

# Database Configuration (supports environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transcendence_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${SERVER_PORT:8080}
server.error.include-message=always

# HTTPS/SSL Configuration (for production)
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEYSTORE:}
server.ssl.key-store-password=${SERVER_SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=900000
jwt.refresh.expiration=604800000

# Email Configuration (using environment variables)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=blackmantadjomino@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_FROM:noreply@transcendence.com}
app.support.email=${SUPPORT_EMAIL:${spring.mail.username}}

# Frontend URL
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Reverse proxy: trust X-Forwarded-* headers from nginx (correct https scheme/host for OAuth2 redirects)
server.forward-headers-strategy=framework

# Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Logging
logging.level.root=INFO
logging.level.com.ft.transcendence=INFO
logging.level.org.springframework.security=WARN

# OAuth2 Configuration with 42 API
spring.security.oauth2.client.registration.42.client-id=${OAUTH2_42_CLIENT_ID}
spring.security.oauth2.client.registration.42.client-secret=${OAUTH2_42_CLIENT_SECRET}
spring.security.oauth2.client.registration.42.redirect-uri={baseUrl}/login/oauth2/code/42
spring.security.oauth2.client.registration.42.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.42.scope=public

spring.security.oauth2.client.provider.42.authorization-uri=https://api.intra.42.fr/oauth/authorize
spring.security.oauth2.client.provider.42.token-uri=https://api.intra.42.fr/oauth/token
spring.security.oauth2.client.provider.42.user-info-uri=https://api.intra.42.fr/v2/me
spring.security.oauth2.client.provider.42.user-name-attribute=login

# OAuth2 Configuration with GitHub
spring.security.oauth2.client.registration.github.client-id=${OAUTH2_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${OAUTH2_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.github.scope=user:email,read:user

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

# Markets / order book generation
markets.generator.enabled=${MARKETS_GENERATOR_ENABLED:true}
markets.generator.target-count=${MARKETS_GENERATOR_TARGET_COUNT:12}
markets.generator.cron=${MARKETS_GENERATOR_CRON:0 0 */6 * * ?}
markets.migration.backfill-consent-on-startup=${MARKETS_MIGRATION_BACKFILL_CONSENT_ON_STARTUP:false}
markets.project-filter.max-age-days=${MARKETS_PROJECT_FILTER_MAX_AGE_DAYS:120}
markets.project-filter.excluded-keywords=${MARKETS_PROJECT_FILTER_EXCLUDED_KEYWORDS:exam,piscine,rank}
forty-two.api.base-url=${FORTY_TWO_API_BASE_URL:https://api.intra.42.fr}
forty-two.api.bearer-token=${FORTY_TWO_API_BEARER_TOKEN:}
forty-two.api.me-path=${FORTY_TWO_API_ME_PATH:/v2/me}

# Blockchain / TK42 token (BSC Testnet)
blockchain.enabled=${BLOCKCHAIN_ENABLED:false}
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:https://data-seed-prebsc-1-s1.binance.org:8545}
blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:97}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x3aBfE55f0D8468edC60f363aECE6Ae136ADB99Dd}
blockchain.token-decimals=${BLOCKCHAIN_TOKEN_DECIMALS:18}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}
blockchain.gas-limit=${BLOCKCHAIN_GAS_LIMIT:300000}